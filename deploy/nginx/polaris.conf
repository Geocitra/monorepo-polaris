# =========================================================================
# POLARIS MEDIA PLATFORM - NGINX CONFIGURATION (polarismedia.id)
# Simpan berkas ini di: ~/e-daily-report/docker/nginx/polaris.conf
# =========================================================================

# --- 1. BLOK HTTP (PORT 80): Certbot ACME Challenge & Redirect ke HTTPS ---
server {
    listen 80;
    server_name polarismedia.id www.polarismedia.id app.polarismedia.id api.polarismedia.id *.polarismedia.id;
    server_tokens off;

    # Validasi Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect seluruh request HTTP ke HTTPS secara otomatis
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 2. BACKEND API ENGINE (api.polarismedia.id) ---
server {
    listen 443 ssl;
    server_name api.polarismedia.id;
    server_tokens off;

    # Sertifikat SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/polarismedia.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polarismedia.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Limit payload upload media/gambar hingga 50MB
    client_max_body_size 50M;

    location / {
        # Port 4000 di host VPS
        proxy_pass http://172.17.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# --- 3. EXECUTIVE WORKSPACE / DASHBOARD CMS (app.polarismedia.id) ---
server {
    listen 443 ssl;
    server_name app.polarismedia.id;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/polarismedia.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polarismedia.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        # Port 3002 di host VPS (Next.js Dashboard Standalone)
        proxy_pass http://172.17.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# --- 4. PUBLIC CIVIC MICROSITE & MULTI-SUBDOMAIN (polarismedia.id, www, *.polarismedia.id) ---
server {
    listen 443 ssl;
    server_name polarismedia.id www.polarismedia.id *.polarismedia.id;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/polarismedia.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polarismedia.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        # Port 3001 di host VPS (Next.js Web Portal Standalone)
        proxy_pass http://172.17.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
