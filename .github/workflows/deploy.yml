name: POLARIS Continuous Deployment (CD)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # JOB 1: MULTI-STAGE DOCKER CONTAINER BUILD & PUSH (GHCR)
  # =========================================================================
  build-and-push-images:
    name: Build & Push Micro-Containers to GHCR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api-core
            dockerfile: Dockerfile.api-core
            image: polaris-api-core
          - service: web-dashboard
            dockerfile: Dockerfile.web-dashboard
            image: polaris-web-dashboard
          - service: web-portal
            dockerfile: Dockerfile.web-portal
            image: polaris-web-portal
          - service: worker-crawler
            dockerfile: Dockerfile.worker-crawler
            image: polaris-worker-crawler
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.polarismedia.id/api/v1' }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ vars.NEXT_PUBLIC_ROOT_DOMAIN || 'polarismedia.id' }}
            NEXT_PUBLIC_PORTAL_URL=${{ vars.NEXT_PUBLIC_PORTAL_URL || 'https://polarismedia.id' }}
            NEXT_PUBLIC_DASHBOARD_URL=${{ vars.NEXT_PUBLIC_DASHBOARD_URL || 'https://app.polarismedia.id' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # JOB 2: ZERO-DOWNTIME ROLLING DEPLOYMENT KE VPS PRODUKSI
  # =========================================================================
  deploy-to-production:
    name: Zero-Downtime Rolling Rollout on VPS
    runs-on: ubuntu-latest
    needs: [build-and-push-images]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH Key & Host Verification
        run: |
          mkdir -p ~/.ssh
          # tr -d '\r' memastikan private key bebas dari format CRLF Windows yang bisa merusak format PEM OpenSSH
          echo "${{ secrets.PROD_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.PROD_SSH_PORT || 22 }} -H "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Transfer Deployment Files to VPS
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -p ${{ secrets.PROD_SSH_PORT || 22 }} -i ~/.ssh/id_rsa ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} "mkdir -p /home/${{ secrets.PROD_SSH_USER }}/monorepo-polaris"
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -P ${{ secrets.PROD_SSH_PORT || 22 }} -i ~/.ssh/id_rsa -r docker-compose.prod.yml scripts/deploy-production.sh packages/database/src/migrations ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/home/${{ secrets.PROD_SSH_USER }}/monorepo-polaris/

      - name: Execute Remote Deployment via SSH
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -p ${{ secrets.PROD_SSH_PORT || 22 }} -i ~/.ssh/id_rsa ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} 'bash -se' << 'EOF'
            echo "=========================================================="
            echo " [POLARIS CD] Memulai Rolling Deployment Versi ${{ github.sha }} "
            echo "=========================================================="

            cd /home/${{ secrets.PROD_SSH_USER }}/monorepo-polaris

            # 1. Login ke GHCR di server VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Sinkronkan git jika koneksi VPS ke GitHub tersedia (force IPv4 & timeout proteksi)
            git -c http.connectTimeout=10 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=10 fetch -4 origin main 2>/dev/null && git reset --hard origin/main 2>/dev/null || {
              echo "ℹ️ Info: Git fetch dari VPS ke GitHub dilewati / timeout (menggunakan file deployment yang disinkronkan via SCP)."
            }

            # 3. Jalankan script rolling deployment aman
            chmod +x ./scripts/deploy-production.sh
            ./scripts/deploy-production.sh
          EOF

      - name: Secure Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/id_rsa
