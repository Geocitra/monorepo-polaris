name: POLARIS Continuous Integration (CI)

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: STATIC ANALYSIS & TYPE CHECKING
  # =========================================================================
  static-analysis:
    name: Lint & Type Safety Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Strict Type Checking Across All Workspaces
        run: pnpm check-types

  # =========================================================================
  # JOB 2: AUTOMATED DOMAIN INVARIANTS & UNIT TESTS
  # =========================================================================
  unit-tests:
    name: Domain & Financial Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [static-analysis]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Headless Shell for Storage Poster Tests
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Build Core Domain Packages
        run: pnpm build

      - name: Run Vitest Unit Tests (Pure Invariants, Fee Calculator, Guardrails)
        run: pnpm test

  # =========================================================================
  # JOB 2B: POSTGRESQL FORCE-RLS & INSTITUTIONAL HTTP E2E SUITE (FASE 1-3)
  # =========================================================================
  integration-e2e:
    name: PostgreSQL FORCE RLS & Institutional E2E (Fase 1-3)
    runs-on: ubuntu-latest
    needs: [static-analysis]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: polaris_admin
          POSTGRES_PASSWORD: polaris_ci_password
          POSTGRES_DB: polaris_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared, Database, AI Engine & API Core
        run: pnpm --filter @polaris/api-core... build

      - name: Apply All Migrations & Provision Non-Superuser RLS Role
        env:
          DATABASE_URL: postgresql://polaris_admin:polaris_ci_password@127.0.0.1:5432/polaris_db
        run: |
          node scripts/db-migrate.mjs
          PGPASSWORD=polaris_ci_password psql -h 127.0.0.1 -U polaris_admin -d polaris_db -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'polaris_app') THEN
              CREATE ROLE polaris_app LOGIN PASSWORD 'polaris_app_ci_password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
            END IF;
          END $$;
          GRANT USAGE, CREATE ON SCHEMA public TO polaris_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO polaris_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO polaris_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO polaris_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO polaris_app;
          SQL

      - name: Run PostgreSQL FORCE RLS & Institutional Integration Tests
        env:
          DATABASE_URL: postgresql://polaris_app:polaris_app_ci_password@127.0.0.1:5432/polaris_db
          OPENAI_API_KEY: sk-mock-ci-key
          AI_USE_ROUTER: 'false'
        run: |
          node packages/database/test/rls-context.mjs
          node packages/database/test/rls-institutional-kernel.mjs
          node packages/database/test/institutional-fase1.mjs
          node packages/database/test/lkpj-fase2.mjs
          node packages/database/test/parliamentary-fase3.mjs

      - name: Run Live HTTP E2E Tests (Fase 1, 2 & 3)
        env:
          DATABASE_URL: postgresql://polaris_app:polaris_app_ci_password@127.0.0.1:5432/polaris_db
          OPENAI_API_KEY: sk-mock-ci-key
          AI_USE_ROUTER: 'false'
        run: pnpm --filter @polaris/api-core test:e2e

  # =========================================================================
  # JOB 3: SECURITY AUDIT & SUPPLY CHAIN CHECK
  # =========================================================================
  security-audit:
    name: Supply Chain Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Run UU PDP & ISO 27001 Compliance Audit
        run: bash scripts/audit-compliance.sh

      - name: Audit High & Critical Vulnerabilities
        run: pnpm audit --audit-level=high
        continue-on-error: true # Melaporkan temuan tanpa memblokir darurat non-kritis
