networks:
  polaris_prod_net:
    driver: bridge
    ipam:
      driver: default

volumes:
  polaris_pg_data:
    driver: local
  polaris_redis_data:
    driver: local

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  # =========================================================================
  # 1. DATABASE KERNEL: POSTGRESQL 16 + PGVECTOR
  # Port 5432 TIDAK DIEKSPOS KE HOST (Hanya internal bridge network polaris_prod_net)
  # Aman 100% dan tidak akan bentrok dengan database edaily di host!
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: polaris_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polaris_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polaris_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-polaris_db}
    volumes:
      - polaris_pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - polaris_prod_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polaris_admin} -d ${POSTGRES_DB:-polaris_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 350M
    logging: *default-logging

  # =========================================================================
  # 2. CACHING & QUEUE BUS: REDIS 7
  # Port 6379 TIDAK DIEKSPOS KE HOST (Hanya internal bridge network)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: polaris_prod_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-polaris_redis_secret_2026}
    volumes:
      - polaris_redis_data:/data
    networks:
      - polaris_prod_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-polaris_redis_secret_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
    logging: *default-logging

  # =========================================================================
  # 3. BACKEND API CORE: NESTJS MODULAR APPLICATION
  # =========================================================================
  api-core:
    image: ghcr.io/geocitra/polaris-api-core:latest
    build:
      context: .
      dockerfile: Dockerfile.api-core
    container_name: polaris_prod_api_core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-polaris_admin}:${POSTGRES_PASSWORD:-polaris_secret_2026}@postgres:5432/${POSTGRES_DB:-polaris_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-polaris_redis_secret_2026}@redis:6379
      - NODE_ENV=production
      - PORT=4000
      - DASHBOARD_URL=${NEXT_PUBLIC_DASHBOARD_URL:-https://app.polarismedia.id}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION:-v25.0}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-1495802246941473}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID:-1445010465358072}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-polaris-wa-webhook-verify-2026}
      - WHATSAPP_WEEKLY_REQUEST_LIMIT=${WHATSAPP_WEEKLY_REQUEST_LIMIT:-3}
      - WHATSAPP_MAX_REVISION_ROUNDS=${WHATSAPP_MAX_REVISION_ROUNDS:-3}
      - WHATSAPP_DRAFT_DEBOUNCE_SECONDS=${WHATSAPP_DRAFT_DEBOUNCE_SECONDS:-25}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - polaris_prod_net
    ports:
      - "0.0.0.0:4000:4000"
    volumes:
      - ./assets:/app/assets:ro
      - ./uploads:/app/uploads
      - ./scripts:/app/scripts:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 300M
    logging: *default-logging

  # =========================================================================
  # 4. HEADLESS BACKGROUND WORKER: BULLMQ PROCESSORS & CRON
  # =========================================================================
  worker-crawler:
    image: ghcr.io/geocitra/polaris-worker-crawler:latest
    build:
      context: .
      dockerfile: Dockerfile.worker-crawler
    container_name: polaris_prod_worker_crawler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-polaris_admin}:${POSTGRES_PASSWORD:-polaris_secret_2026}@postgres:5432/${POSTGRES_DB:-polaris_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-polaris_redis_secret_2026}@redis:6379
      - NODE_ENV=production
    volumes:
      - ./assets:/app/assets:ro
      - ./uploads:/app/uploads
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-core:
        condition: service_started
    networks:
      - polaris_prod_net
    # Chromium butuh /dev/shm lebih besar & init process untuk me-reap zombie child process
    shm_size: '512mb'
    init: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging

  # =========================================================================
  # 5. PRIVATE EXECUTIVE WORKSPACE: NEXT.JS STANDALONE DASHBOARD
  # Port host di-mapping ke 3002 (karena port 3000 sudah dipakai edaily-renderer)
  # =========================================================================
  web-dashboard:
    image: ghcr.io/geocitra/polaris-web-dashboard:latest
    build:
      context: .
      dockerfile: Dockerfile.web-dashboard
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.polarismedia.id/api/v1}
        - NEXT_PUBLIC_ROOT_DOMAIN=${NEXT_PUBLIC_ROOT_DOMAIN:-polarismedia.id}
        - NEXT_PUBLIC_PORTAL_URL=${NEXT_PUBLIC_PORTAL_URL:-https://polarismedia.id}
    container_name: polaris_prod_web_dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INTERNAL_API_URL=http://api-core:4000/api/v1
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.polarismedia.id/api/v1}
      - NEXT_PUBLIC_ROOT_DOMAIN=${NEXT_PUBLIC_ROOT_DOMAIN:-polarismedia.id}
      - NEXT_PUBLIC_PORTAL_URL=${NEXT_PUBLIC_PORTAL_URL:-https://polarismedia.id}
    depends_on:
      - api-core
    networks:
      - polaris_prod_net
    ports:
      - "0.0.0.0:3002:3000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 350M
    logging: *default-logging

  # =========================================================================
  # 6. PUBLIC CIVIC MICROSITE: NEXT.JS STANDALONE PORTAL
  # Port host di-mapping ke 3001
  # =========================================================================
  web-portal:
    image: ghcr.io/geocitra/polaris-web-portal:latest
    build:
      context: .
      dockerfile: Dockerfile.web-portal
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.polarismedia.id/api/v1}
        - NEXT_PUBLIC_ROOT_DOMAIN=${NEXT_PUBLIC_ROOT_DOMAIN:-polarismedia.id}
        - NEXT_PUBLIC_DASHBOARD_URL=${NEXT_PUBLIC_DASHBOARD_URL:-https://app.polarismedia.id}
    container_name: polaris_prod_web_portal
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - INTERNAL_API_URL=http://api-core:4000/api/v1
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.polarismedia.id/api/v1}
      - NEXT_PUBLIC_ROOT_DOMAIN=${NEXT_PUBLIC_ROOT_DOMAIN:-polarismedia.id}
      - NEXT_PUBLIC_DASHBOARD_URL=${NEXT_PUBLIC_DASHBOARD_URL:-https://app.polarismedia.id}
    depends_on:
      - api-core
    networks:
      - polaris_prod_net
    ports:
      - "0.0.0.0:3001:3001"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 350M
    logging: *default-logging
